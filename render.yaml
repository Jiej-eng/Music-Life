
services:
  - type: web
    name: aurelia-vinyl-live
    runtime: node
    plan: free
    region: frankfurt
   buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
